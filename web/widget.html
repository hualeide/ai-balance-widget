<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>AI Balance</title>
<style>
  html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #3a4458;
    font-family: "Segoe UI", "SF Pro Display", "PingFang SC", sans-serif;
    user-select: none;
    color: #e8eefc;
    border-radius: 32px;
  }
  .wrap {
    position: fixed;
    inset: 0;
    background: #3a4458;
    border-radius: 32px;
    overflow: hidden;
  }
  .glass-panel {
    position: absolute;
    inset: 0;
    box-sizing: border-box;
    padding: 16px 18px 12px;
    background:
      linear-gradient(160deg, rgba(0, 234, 255, 0.14), transparent 48%, rgba(139, 92, 246, 0.12)),
      #3a4458;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.22);
    border-radius: 32px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .glass-panel::before {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 32px;
    padding: 1px;
    background: linear-gradient(135deg, #00eaff, transparent 42%, #8b5cf6);
    -webkit-mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    -webkit-mask-composite: xor;
    mask:
      linear-gradient(#000 0 0) content-box,
      linear-gradient(#000 0 0);
    mask-composite: exclude;
    pointer-events: none;
  }
  header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    position: relative;
    z-index: 1;
  }
  .mark {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    background: linear-gradient(135deg, #00d4ff, #8b5cf6);
    box-shadow: 0 0 16px rgba(0, 212, 255, 0.45);
  }
  h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.02em;
    flex: 1;
  }
  header button {
    width: 26px;
    height: 26px;
    border: 0;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.12);
    color: #e8eefc;
    cursor: pointer;
    font-size: 14px;
  }
  header button:hover { background: rgba(255, 255, 255, 0.22); }
  .rows {
    flex: 1;
    display: flex;
    flex-direction: column;
    gap: 10px;
    min-height: 0;
    overflow-x: hidden;
    overflow-y: auto;
    padding-bottom: 8px;
    position: relative;
    z-index: 1;
    overscroll-behavior: contain;
    scrollbar-width: thin;
    scrollbar-color: rgba(255, 255, 255, 0.35) transparent;
  }
  .rows::-webkit-scrollbar { width: 6px; }
  .rows::-webkit-scrollbar-thumb {
    background: rgba(255, 255, 255, 0.35);
    border-radius: 8px;
  }
  .row {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .ico {
    width: 40px;
    height: 40px;
    border-radius: 12px;
    overflow: hidden;
    display: grid;
    place-items: center;
    flex-shrink: 0;
  }
  .ico svg { width: 22px; height: 22px; fill: #fff; }
  .amt {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 0.01em;
  }
  .edge { position: absolute; z-index: 5; }
  .edge.n { top: 0; left: 16px; right: 16px; height: 8px; cursor: ns-resize; }
  .edge.s { bottom: 0; left: 16px; right: 16px; height: 8px; cursor: ns-resize; }
  .edge.w { left: 0; top: 16px; bottom: 16px; width: 8px; cursor: ew-resize; }
  .edge.e { right: 0; top: 16px; bottom: 16px; width: 8px; cursor: ew-resize; }
  .edge.nw { top: 0; left: 0; width: 16px; height: 16px; cursor: nwse-resize; }
  .edge.ne { top: 0; right: 0; width: 16px; height: 16px; cursor: nesw-resize; }
  .edge.sw { bottom: 0; left: 0; width: 16px; height: 16px; cursor: nesw-resize; }
  .edge.se { bottom: 0; right: 0; width: 16px; height: 16px; cursor: nwse-resize; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="glass-panel" id="panel">
    <header>
      <div class="mark"></div>
      <h2>AI Balance</h2>
      <button id="btnMin" title="隐藏">−</button>
      <button id="btnGear" title="设置">⚙</button>
    </header>
    <div class="rows" id="rows"></div>
  </div>
</div>
<div class="edge n" data-e="4"></div>
<div class="edge s" data-e="8"></div>
<div class="edge w" data-e="1"></div>
<div class="edge e" data-e="2"></div>
<div class="edge nw" data-e="5"></div>
<div class="edge ne" data-e="6"></div>
<div class="edge sw" data-e="9"></div>
<div class="edge se" data-e="10"></div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
  const COLORS = {
    cursor: "#000000", chatgpt: "#10A37F", google: "#8E75B2",
    deepseek: "#4D6BFE", openrouter: "#1A1A1A", moonshot: "#000000",
    siliconflow: "#7C3AED"
  }
  let bridge = null
  window.updateData = function (payload) {
    const rows = payload.rows || []
    const box = document.getElementById("rows")
    box.innerHTML = rows.map(r => `
      <div class="row">
        <div class="ico" style="background:${COLORS[r.id] || "#6366F1"}">${r.svg || ""}</div>
        <div class="amt">${r.amount}</div>
      </div>`).join("")
    requestAnimationFrame(() => {
      const header = document.querySelector("header")
      const n = box.children.length
      const rowsH = n * 40 + Math.max(0, n - 1) * 10
      const needW = 280
      const needH = 16 + 12 + (header ? header.offsetHeight : 36) + 10 + rowsH + 14
      if (bridge && bridge.fitSize) bridge.fitSize(needW, needH)
    })
  }
  function bind() {
    document.getElementById("btnMin").onclick = (e) => { e.stopPropagation(); bridge && bridge.hideWin() }
    document.getElementById("btnGear").onclick = (e) => { e.stopPropagation(); bridge && bridge.openSettings() }
    document.getElementById("panel").addEventListener("click", (e) => {
      if (e.target.closest("button")) return
      bridge && bridge.refresh()
    })
    document.addEventListener("contextmenu", (e) => { e.preventDefault(); bridge && bridge.menu() })
    let drag = null, resize = null
    function endPointer() {
      if (drag || resize) bridge && bridge.saveGeom()
      drag = resize = null
    }
    document.getElementById("rows").addEventListener("wheel", (e) => e.stopPropagation(), { passive: true })
    document.getElementById("panel").addEventListener("pointerdown", (e) => {
      if (e.button !== 0) return
      if (e.target.closest("button") || e.target.closest(".edge") || e.target.closest(".rows")) return
      drag = { x: e.screenX, y: e.screenY }
    })
    window.addEventListener("pointermove", (e) => {
      if (drag && !(e.buttons & 1)) drag = null
      if (resize && !(e.buttons & 1)) resize = null
      if (drag && bridge) {
        const dx = e.screenX - drag.x, dy = e.screenY - drag.y
        if (Math.abs(dx) + Math.abs(dy) < 2) return
        bridge.dragBy(dx, dy)
        drag = { x: e.screenX, y: e.screenY }
      }
      if (resize && bridge) {
        bridge.resizeBy(resize.e, e.screenX - resize.x, e.screenY - resize.y)
        resize = { e: resize.e, x: e.screenX, y: e.screenY }
      }
    })
    window.addEventListener("pointerup", endPointer)
    window.addEventListener("pointercancel", endPointer)
    document.querySelectorAll(".edge").forEach(el => {
      el.addEventListener("pointerdown", (e) => {
        if (e.button !== 0) return
        e.stopPropagation()
        resize = { e: +el.dataset.e, x: e.screenX, y: e.screenY }
      })
    })
  }
  if (window.qt && qt.webChannelTransport) {
    new QWebChannel(qt.webChannelTransport, (ch) => { bridge = ch.objects.bridge; bind() })
  } else {
    bind()
    updateData({
      ok: true, total: "¥ 8.32",
      rows: [
        { id: "cursor", name: "Cursor", amount: "$0.00", svg: "" },
        { id: "deepseek", name: "DeepSeek", amount: "¥ 8.32", svg: "" }
      ]
    })
  }
</script>
</body>
</html>
